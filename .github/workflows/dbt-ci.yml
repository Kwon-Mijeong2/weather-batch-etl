name: dbt CI

on:

  push:
    branches:
      - main

  pull_request:

  
jobs:
  dbt:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: airflow
          POSTGRES_PASSWORD: airflow
          POSTGRES_DB: airflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt
        run: |
          pip install dbt-postgres

      - name: Run dbt
        working-directory: weather_dbt
        run: |
          dbt deps --profiles-dir .
          dbt run --profiles-dir .
          dbt test --profiles-dir .